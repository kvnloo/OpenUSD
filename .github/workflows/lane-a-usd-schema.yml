name: Lane A USD schema gate
on:
  push:
    branches:
      - lane-a/usd-schema-gate-20261011
    paths:
      - 'experiments/lane_a_depth_usd/**'
      - '.github/workflows/lane-a-usd-schema.yml'
  pull_request:
    paths:
      - 'experiments/lane_a_depth_usd/**'
      - '.github/workflows/lane-a-usd-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-usd-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install OpenUSD parser and pytest
        run: python -m pip install --disable-pip-version-check 'usd-core==26.8' 'pytest==9.0.2'
      - name: Require real OpenUSD and reference composition
        env:
          LANE_A_REQUIRE_PXR: '1'
        run: python -m pytest -q experiments/lane_a_depth_usd
